name: Create GitHub Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
          TITLE="$(git for-each-ref "refs/tags/${TAG}" --format='%(contents:subject)')"
          if [ -z "$TITLE" ]; then
            TITLE="CAMBLU Portal — ${TAG}"
          fi
          IS_PRERELEASE=false
          if [[ "$TAG" == *alpha* || "$TAG" == *alfa* || "$TAG" == *beta* || "$TAG" == *rc* ]]; then
            IS_PRERELEASE=true
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ "$IS_PRERELEASE" = true ]; then
              gh release edit "$TAG" --title "$TITLE" --prerelease
            else
              gh release edit "$TAG" --title "$TITLE" --prerelease=false
            fi
          else
            if [ "$IS_PRERELEASE" = true ]; then
              gh release create "$TAG" --title "$TITLE" --prerelease --generate-notes
            else
              gh release create "$TAG" --title "$TITLE" --generate-notes
            fi
          fi
